global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'modern-web-app-01-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8080']
        labels:
          environment: 'production'
          app: 'modern-web-app-01'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
