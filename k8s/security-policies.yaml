apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: modern-web-app-01-pdb
  namespace: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: modern-web-app-01
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modern-web-app-01-default-deny
  namespace: production
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modern-web-app-01-allow-ingress
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: modern-web-app-01
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: production
  name: modern-web-app-01-service-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modern-web-app-01-binding
  namespace: production
subjects:
- kind: ServiceAccount
  name: modern-web-app-01-sa
  namespace: production
roleRef:
  kind: Role
  name: modern-web-app-01-service-role
  apiGroup: rbac.authorization.k8s.io
